<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 320px; padding: 12px; font-family: sans-serif; margin: 0; }
    h3 { margin: 0 0 10px; }
    .tabs { display: flex; gap: 4px; margin: 12px 0 8px; }
    .tab {
      flex: 1; padding: 5px 0; font-size: 12px; text-align: center;
      border: 1px solid #ccc; border-radius: 4px; cursor: pointer;
      background: #f5f5f5; color: #555;
    }
    .tab.active { background: #4CAF50; color: white; border-color: #4CAF50; }
    #convList { max-height: 280px; overflow-y: auto; margin-top: 4px; }
    .card {
      border: 1px solid #e0e0e0; border-radius: 6px; padding: 8px;
      margin-bottom: 6px; font-size: 12px;
    }
    .card-header { display: flex; justify-content: space-between; margin-bottom: 4px; }
    .card-ai { font-weight: bold; color: #333; }
    .card-cat { color: #888; font-size: 11px; }
    .card-time { color: #aaa; font-size: 10px; margin-bottom: 4px; }
    .card-content { color: #555; line-height: 1.4; }
    #listStatus { font-size: 11px; color: #999; text-align: center; padding: 8px 0; }
  </style>
</head>
<body>
  <h3>My-AI-Library</h3>

  <div id="mainSection">
    <button id="connectionBtn" type="button" style="width:100%;padding:8px;margin-bottom:6px">연결만 확인 (저장 없음)</button>
    <div id="connectionStatus" role="status" style="font-size:12px;white-space:pre-wrap;margin-bottom:8px">연결 점검 전 · 2.9-purpose-folders-1</div>
    <label for="categorySelect" style="display:block;margin-bottom:5px;font-weight:600">저장 폴더</label>
    <select id="categorySelect" style="width: 100%; margin-bottom: 8px;">
      <option value="">미분류 · 자동 분류 준비 중</option>
      <option value="medical-tech">의료신기술</option>
      <option value="health">건강상식</option>
      <option value="life">생활정보</option>
      <option value="investment">투자정보</option>
      <option value="ai-tech">AI신기술</option>
    </select>

    <p id="categoryStatus" role="status" style="font-size:12px;line-height:1.5;margin:0 0 8px">선택한 폴더는 답변 옆 저장 버튼에도 적용됩니다. Jev 자동 분류는 아직 실행되지 않습니다.</p>

    <button id="extractBtn" style="width: 100%; padding: 8px; background: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer;">서버에 저장하기</button>
    <button id="downloadBtn" style="width: 100%; padding: 8px; margin-top: 8px; background: #2196F3; color: white; border: none; border-radius: 4px; cursor: pointer;">하드에 소장하기 (.md)</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
