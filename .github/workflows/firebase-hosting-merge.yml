name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install and Build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
          VITE_KAKAO_JAVASCRIPT_KEY: ${{ secrets.VITE_KAKAO_JAVASCRIPT_KEY }}
          VITE_PORTONE_STORE_ID: ${{ secrets.VITE_PORTONE_STORE_ID }}
          VITE_PORTONE_CHANNEL_KEY: ${{ secrets.VITE_PORTONE_CHANNEL_KEY }}
          VITE_PORTONE_INICIS_CHANNEL_KEY: ${{ secrets.VITE_PORTONE_INICIS_CHANNEL_KEY }}
          VITE_PORTONE_INICIS_BILLING_CHANNEL_KEY: ${{ secrets.VITE_PORTONE_INICIS_BILLING_CHANNEL_KEY }}
          VITE_PORTONE_SINGLE_PAYMENT_PAY_METHOD: ${{ secrets.VITE_PORTONE_SINGLE_PAYMENT_PAY_METHOD }}
          VITE_PORTONE_TOSS_CHANNEL_KEY: ${{ secrets.VITE_PORTONE_TOSS_CHANNEL_KEY }}
          VITE_AI_LIBRARY_FIREBASE_API_KEY: ${{ secrets.VITE_AI_LIBRARY_FIREBASE_API_KEY }}
          VITE_AI_LIBRARY_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_AI_LIBRARY_FIREBASE_AUTH_DOMAIN }}
          VITE_AI_LIBRARY_FIREBASE_PROJECT_ID: ${{ secrets.VITE_AI_LIBRARY_FIREBASE_PROJECT_ID }}
          VITE_AI_LIBRARY_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_AI_LIBRARY_FIREBASE_STORAGE_BUCKET }}
          VITE_AI_LIBRARY_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_AI_LIBRARY_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_AI_LIBRARY_FIREBASE_APP_ID: ${{ secrets.VITE_AI_LIBRARY_FIREBASE_APP_ID }}
        run: |
          cd frontend
          for name in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_STORAGE_BUCKET VITE_FIREBASE_MESSAGING_SENDER_ID VITE_FIREBASE_APP_ID VITE_AI_LIBRARY_FIREBASE_API_KEY VITE_AI_LIBRARY_FIREBASE_AUTH_DOMAIN VITE_AI_LIBRARY_FIREBASE_PROJECT_ID VITE_AI_LIBRARY_FIREBASE_STORAGE_BUCKET VITE_AI_LIBRARY_FIREBASE_MESSAGING_SENDER_ID VITE_AI_LIBRARY_FIREBASE_APP_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured"
              exit 1
            fi
          done
          npm ci
          npm run build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_HARU2026 }}'
          channelId: live
          projectId: haru2026-8abb8
