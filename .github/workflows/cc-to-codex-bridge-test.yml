name: CC to Codex event bridge (test)

on:
  issue_comment:
    types: [created]

jobs:
  handoff:
    if: github.event.issue.pull_request != null && contains(github.event.issue.labels.*.name, 'cc-codex-bridge-test') && startsWith(github.event.comment.body, '## CC 독립 검토 결과') && contains(github.event.comment.body, 'Generated by [Claude Code]')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
    steps:
      - name: Request Codex follow-up for the current PR HEAD
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const body = context.payload.comment.body;
            const claimedHead = body.match(/HEAD\s*`([0-9a-f]{7,40})`/i)?.[1];
            if (!claimedHead) return;

            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: issue_number });
            if (pr.state !== 'open' || !pr.head.sha.startsWith(claimedHead)) return;

            const marker = `<!-- cc-to-codex-test:${pr.head.sha} -->`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            if (comments.some(comment => comment.body?.includes(marker))) return;

            await github.rest.issues.createComment({
              owner, repo, issue_number,
              body: `${marker}\n@codex CC가 이 PR의 현재 HEAD를 독립 검토했습니다. 바로 위 CC 검토 댓글을 읽고 지적 사항을 코드와 대조해 주세요. 항목별로 반영 필요 또는 보류와 근거를 이 PR에 답해 주세요. 코드를 수정하거나 커밋·병합·배포하지 마세요.`,
            });
