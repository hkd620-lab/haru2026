name: Deploy to Firebase Hosting on PR

on: pull_request

jobs:
  build_and_preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install and Build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || 'dummy' }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || 'dummy.firebaseapp.com' }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || 'dummy' }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || 'dummy.firebasestorage.app' }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || '000000000000' }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || '1:000000000000:web:dummy' }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY || 'dummy' }}
          VITE_KAKAO_JAVASCRIPT_KEY: ${{ secrets.VITE_KAKAO_JAVASCRIPT_KEY || 'dummy' }}
          VITE_PORTONE_STORE_ID: ${{ secrets.VITE_PORTONE_STORE_ID || 'dummy' }}
          VITE_PORTONE_KAKAOPAY_CHANNEL_KEY: ${{ secrets.VITE_PORTONE_KAKAOPAY_CHANNEL_KEY || 'dummy' }}
          VITE_PORTONE_KAKAOPAY_BILLING_CHANNEL_KEY: ${{ secrets.VITE_PORTONE_KAKAOPAY_BILLING_CHANNEL_KEY || 'dummy' }}
          VITE_PORTONE_CHANNEL_KEY: ${{ secrets.VITE_PORTONE_CHANNEL_KEY || 'dummy' }}
          VITE_PORTONE_INICIS_CHANNEL_KEY: ${{ secrets.VITE_PORTONE_INICIS_CHANNEL_KEY || 'dummy' }}
          VITE_PORTONE_INICIS_BILLING_CHANNEL_KEY: ${{ secrets.VITE_PORTONE_INICIS_BILLING_CHANNEL_KEY || 'dummy' }}
          VITE_PORTONE_SINGLE_PAYMENT_PAY_METHOD: ${{ secrets.VITE_PORTONE_SINGLE_PAYMENT_PAY_METHOD || 'EASY_PAY' }}
          VITE_PORTONE_TOSS_CHANNEL_KEY: ${{ secrets.VITE_PORTONE_TOSS_CHANNEL_KEY || 'dummy' }}
          VITE_AI_LIBRARY_FIREBASE_API_KEY: ${{ secrets.VITE_AI_LIBRARY_FIREBASE_API_KEY || 'dummy' }}
          VITE_AI_LIBRARY_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_AI_LIBRARY_FIREBASE_AUTH_DOMAIN || 'dummy.firebaseapp.com' }}
          VITE_AI_LIBRARY_FIREBASE_PROJECT_ID: ${{ secrets.VITE_AI_LIBRARY_FIREBASE_PROJECT_ID || 'dummy' }}
          VITE_AI_LIBRARY_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_AI_LIBRARY_FIREBASE_STORAGE_BUCKET || 'dummy.firebasestorage.app' }}
          VITE_AI_LIBRARY_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_AI_LIBRARY_FIREBASE_MESSAGING_SENDER_ID || '000000000000' }}
          VITE_AI_LIBRARY_FIREBASE_APP_ID: ${{ secrets.VITE_AI_LIBRARY_FIREBASE_APP_ID || '1:000000000000:web:dummy' }}
        run: |
          cd frontend
          for name in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_STORAGE_BUCKET VITE_FIREBASE_MESSAGING_SENDER_ID VITE_FIREBASE_APP_ID VITE_AI_LIBRARY_FIREBASE_API_KEY VITE_AI_LIBRARY_FIREBASE_AUTH_DOMAIN VITE_AI_LIBRARY_FIREBASE_PROJECT_ID VITE_AI_LIBRARY_FIREBASE_STORAGE_BUCKET VITE_AI_LIBRARY_FIREBASE_MESSAGING_SENDER_ID VITE_AI_LIBRARY_FIREBASE_APP_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured"
              exit 1
            fi
          done
          npm ci
          npm run build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        if: github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_HARU2026 }}'
          projectId: haru2026-8abb8
