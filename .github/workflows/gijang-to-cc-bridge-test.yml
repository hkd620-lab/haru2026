name: Gijang to CC event bridge (test)

on:
  issue_comment:
    types: [created]

jobs:
  handoff:
    # 시험 PR(라벨), 기장 답변 머리말, 열린 PR에서만 실행. CC·봇 댓글에는 반응하지 않는다.
    if: >-
      github.event.issue.pull_request != null &&
      contains(github.event.issue.labels.*.name, 'cc-codex-bridge-test') &&
      github.event.comment.user.login == 'hkd620-lab' &&
      github.event.comment.performed_via_github_app.slug != 'claude' &&
      startsWith(github.event.comment.body, '[기장 확인')
    runs-on: ubuntu-latest
    concurrency:
      group: gijang-cc-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: issue_number });
            if (pr.state !== 'open') return;

            // 같은 HEAD에는 한 번만 재검토 요청 (무한 왕복 방지)
            const marker = `<!-- gijang-to-cc-test:${pr.head.sha} -->`;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            if (comments.some(c => c.user?.login === 'github-actions[bot]' && c.body?.includes(marker))) return;

            await github.rest.issues.createComment({
              owner, repo, issue_number,
              body: `${marker}\n@claude 기장이 CC 독립검토에 답했습니다. 바로 위 [기장 확인] 댓글을 읽고, 현재 HEAD(${pr.head.sha.slice(0, 7)})를 같은 기준으로 재검토해 주세요. 지적이 반영됐는지 항목별로 확인하고, 새 HEAD 기준 결과를 "## CC 독립 재검토 결과" 형식으로 이 PR에 남겨 주세요. 코드·문서를 수정하거나 커밋·병합·배포하지 마세요.`,
            });
